[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-robust-memory-protocol"
version = "0.1.0"
description = "TDD evaluation protocol harness for plan-robust agent memory"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
embedding = [
  "numpy==2.2.6",
  "torch==2.6.0",
  "transformers==4.48.3",
  "huggingface-hub==0.28.1",
  "tokenizers==0.21.0",
  "safetensors==0.5.2",
  "sentencepiece==0.2.0",
  "sentence-transformers==3.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "external: requires network, API credentials, a GPU, or non-fixture benchmark data",
  "qualification: protocol qualification gate",
]
